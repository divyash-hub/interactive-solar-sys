<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Fidelity Solar System Simulator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00e5ff;
            --bg-glass: rgba(10, 15, 25, 0.75);
            --border-glass: rgba(0, 229, 255, 0.2);
        }

        body { 
            margin: 0; overflow: hidden; background-color: #000; 
            font-family: 'Montserrat', sans-serif; color: white; 
            user-select: none; -webkit-font-smoothing: antialiased;
        }

        #canvas-container, #css-renderer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        }
        #canvas-container { z-index: 1; }
        #css-renderer { z-index: 2; pointer-events: none; }
        
        /* Modern Glass UI */
        .ui-layer { position: absolute; z-index: 10; pointer-events: auto; }
        .glass-panel { 
            background: var(--bg-glass); backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass); 
            border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.8), inset 0 0 15px rgba(0, 229, 255, 0.05); 
        }
        
        /* Control Bar */
        #controls { 
            bottom: 30px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 20px; align-items: center; padding: 15px 30px;
        }
        .toggle-group { 
            display: flex; align-items: center; gap: 8px; font-size: 12px; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600; color: #ccc;
        }
        
        input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
        input[type="range"] { accent-color: var(--primary); cursor: pointer; width: 120px; }
        
        /* Enhanced Info Panel */
        #info-panel { 
            top: 30px; right: 30px; width: 340px; padding: 30px;
            transform: translateX(120%); transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
        }
        #info-panel.active { transform: translateX(0); }
        
        #info-title { 
            margin: 0 0 5px 0; color: var(--primary); font-family: 'Orbitron', sans-serif; 
            font-size: 28px; text-transform: uppercase; letter-spacing: 3px;
        }
        #info-subtitle {
            color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;
        }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            padding: 10px; border-radius: 8px;
        }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-size: 14px; font-weight: 600; font-family: 'Orbitron', sans-serif; }

        #info-desc { 
            font-size: 13px; line-height: 1.7; color: #ccc; margin-bottom: 20px;
            padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #info-fact { 
            font-style: italic; color: #fff; font-size: 13px; line-height: 1.5;
            border-left: 3px solid var(--primary); padding-left: 15px;
        }
        
        .close-btn { 
            position: absolute; top: 20px; right: 20px; cursor: pointer; 
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.1); transition: 0.3s;
        }
        .close-btn:hover { background: var(--primary); color: black; }

        /* Floating 3D Labels */
        .planet-label { 
            color: #fff; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase; pointer-events: none; 
            text-shadow: 0 2px 10px rgba(0,0,0,1), 0 0 5px var(--primary); 
            transform: translate(-50%, -100%); margin-top: -15px;
        }
        
        /* Start Overlay */
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #111 0%, #000 100%); 
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            transition: opacity 0.5s ease;
        }
        #start-btn { 
            padding: 16px 40px; font-size: 16px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
            background: transparent; border: 2px solid var(--primary); border-radius: 30px; 
            color: var(--primary); cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        #start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 30px rgba(0, 229, 255, 0.6); }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="color:var(--primary); font-family:'Orbitron', sans-serif; font-size: 48px; letter-spacing: 8px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,229,255,0.5);">HELIOS</h1>
        <p style="color: #888; margin-bottom: 10px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;">Interactive High-Fidelity Solar System</p>
        <p style="color: var(--primary); font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 3px; margin-bottom: 40px; text-shadow: 0 0 10px rgba(0,229,255,0.4);">MADE BY DIVYASH AGRAWAL</p>
        <button id="start-btn">INITIALIZE SIMULATION</button>
    </div>

    <div id="controls" class="ui-layer glass-panel">
        <div class="toggle-group"><input type="checkbox" id="toggle-trails" checked> <label for="toggle-trails">Orbits</label></div>
        <div class="toggle-group"><input type="checkbox" id="toggle-labels" checked> <label for="toggle-labels">Labels</label></div>
        <div class="toggle-group"><input type="checkbox" id="toggle-asteroids" checked> <label for="toggle-asteroids">Asteroids</label></div>
        <div class="toggle-group" style="border-left: 1px solid rgba(255,255,255,0.2); padding-left: 20px; margin-left: 5px;">
            <label for="time-slider">Time:</label>
            <input type="range" id="time-slider" min="0" max="5" step="0.1" value="1">
        </div>
    </div>

    <div id="info-panel" class="ui-layer glass-panel">
        <div class="close-btn" id="close-info">✕</div>
        <h2 id="info-title">Earth</h2>
        <div id="info-subtitle">Terrestrial Planet</div>
        
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Day Length</div>
                <div class="stat-value" id="stat-day">24 Hours</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Year Length</div>
                <div class="stat-value" id="stat-year">365 Days</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Radius</div>
                <div class="stat-value" id="stat-radius">6,371 km</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Gravity</div>
                <div class="stat-value" id="stat-grav">9.8 m/s²</div>
            </div>
        </div>

        <div id="info-desc">Description goes here.</div>
        <div id="info-fact">Fun fact goes here.</div>
    </div>

    <div id="canvas-container"></div>
    <div id="css-renderer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        // --- HIGH-FIDELITY DATA & TEXTURE URLS ---
        const TEX_EARTH = 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
        const TEX_MOON = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg';

        const celestialData = [
            { 
                name: "Sun", type: "star", radius: 8, dist: 0, speed: 0, tilt: 0, color: 0xffdd44,
                subtitle: "Yellow Dwarf Star", day: "27 Earth Days", year: "230M Years", trueRadius: "696,340 km", grav: "274 m/s²",
                desc: "The Sun is the star at the center of the Solar System. It is a nearly perfect sphere of hot plasma, heated to incandescence by nuclear fusion reactions in its core.",
                fact: "The Sun accounts for 99.86% of the total mass of the entire Solar System."
            },
            { 
                name: "Mercury", type: "rocky", radius: 0.8, dist: 14, speed: 0.04, tilt: 0.03, color: 0x8c8c8c,
                subtitle: "Terrestrial Planet", day: "59 Earth Days", year: "88 Earth Days", trueRadius: "2,439 km", grav: "3.7 m/s²",
                desc: "Mercury is the smallest planet in the Solar System and the closest to the Sun. Its surface is heavily cratered and similar in appearance to the Moon.",
                fact: "Despite being closest to the Sun, Mercury is not the hottest planet. That title belongs to Venus."
            },
            { 
                name: "Venus", type: "rocky", radius: 1.8, dist: 22, speed: 0.015, tilt: 3.1, color: 0xe3bb76,
                subtitle: "Terrestrial Planet", day: "243 Earth Days", year: "225 Earth Days", trueRadius: "6,051 km", grav: "8.8 m/s²",
                desc: "Venus is the second planet from the Sun. It has a dense atmosphere consisting mostly of carbon dioxide, creating a runaway greenhouse effect.",
                fact: "Venus rotates in the opposite direction to most other planets, meaning the Sun rises in the west."
            },
            { 
                name: "Earth", type: "earth", radius: 2, dist: 32, speed: 0.01, tilt: 0.41, color: 0x2b82c9, texture: TEX_EARTH,
                subtitle: "Terrestrial Planet", day: "24 Hours", year: "365.25 Days", trueRadius: "6,371 km", grav: "9.8 m/s²",
                desc: "Earth is the third planet from the Sun and the only astronomical object known to harbor life. About 71% of Earth's surface is made up of the ocean.",
                fact: "Earth is the only planet not named after a Greek or Roman god or goddess.",
                moons: [{name: "Moon", radius: 0.5, dist: 3.5, speed: 0.05, texture: TEX_MOON, color: 0xcccccc}] 
            },
            { 
                name: "Mars", type: "rocky", radius: 1.1, dist: 42, speed: 0.008, tilt: 0.44, color: 0xc1440e,
                subtitle: "Terrestrial Planet", day: "24.6 Hours", year: "687 Earth Days", trueRadius: "3,389 km", grav: "3.7 m/s²",
                desc: "Mars is the fourth planet from the Sun. It is a dusty, cold, desert world with a very thin atmosphere, and is known as the Red Planet due to iron oxide.",
                fact: "Mars is home to Olympus Mons, the tallest volcano in the Solar System—three times the height of Mount Everest."
            },
            { 
                name: "Jupiter", type: "gas", radius: 4.5, dist: 65, speed: 0.002, tilt: 0.05, color: 0xc88b3a,
                subtitle: "Gas Giant", day: "10 Hours", year: "11.8 Earth Years", trueRadius: "69,911 km", grav: "24.7 m/s²",
                desc: "Jupiter is the fifth planet from the Sun and the largest in the Solar System. It is a gas giant with a mass more than two and a half times that of all other planets combined.",
                fact: "Jupiter's Great Red Spot is a gigantic storm that has been raging for hundreds of years and is larger than Earth."
            },
            { 
                name: "Saturn", type: "gas", radius: 3.8, dist: 85, speed: 0.0009, tilt: 0.46, color: 0xead6b8, hasRings: true,
                subtitle: "Gas Giant", day: "10.7 Hours", year: "29.4 Earth Years", trueRadius: "58,232 km", grav: "10.4 m/s²",
                desc: "Saturn is the sixth planet from the Sun and the second-largest. It is best known for its prominent ring system, which is composed mostly of ice particles.",
                fact: "Saturn is the only planet in our solar system whose average density is less than water. It could theoretically float in a giant bathtub."
            },
            { 
                name: "Uranus", type: "ice", radius: 2.5, dist: 105, speed: 0.0004, tilt: 1.71, color: 0x4b70dd,
                subtitle: "Ice Giant", day: "17 Hours", year: "84 Earth Years", trueRadius: "25,362 km", grav: "8.7 m/s²",
                desc: "Uranus is the seventh planet from the Sun. It has the third-largest planetary radius and fourth-largest planetary mass in the Solar System.",
                fact: "Uranus rotates on its side, with an axial tilt of 98 degrees. It literally rolls around the Sun like a barrel."
            },
            { 
                // Negative speed means it will orbit in reverse
                name: "Neptune", type: "ice", radius: 2.4, dist: 125, speed: -0.0001, tilt: 0.49, color: 0x274687,
                subtitle: "Ice Giant", day: "16 Hours", year: "165 Earth Years", trueRadius: "24,622 km", grav: "11.1 m/s²",
                desc: "Neptune is the eighth and farthest known planet from the Sun. It is dark, cold, and whipped by supersonic winds.",
                fact: "Neptune was the first planet located through mathematical calculations rather than through regular telescope observations."
            },
            { 
                // Pluto restored! Negative speed for reverse orbit
                name: "Pluto", type: "rocky", radius: 0.6, dist: 140, speed: -0.00005, tilt: 1.0, color: 0xdddddd,
                subtitle: "Dwarf Planet", day: "153 Hours", year: "248 Earth Years", trueRadius: "1,188 km", grav: "0.62 m/s²",
                desc: "Pluto is a dwarf planet in the Kuiper belt, a ring of bodies beyond the orbit of Neptune. It was the first and the largest Kuiper belt object to be discovered.",
                fact: "Pluto was officially reclassified from a major planet to a dwarf planet in 2006."
            }
        ];

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        
        const bgTexture = new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/night-sky.png');
        scene.background = bgTexture;

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 100, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css-renderer').appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.maxDistance = 800; controls.minDistance = 5;

        // --- LIGHTING ---
        scene.add(new THREE.AmbientLight(0x333344, 1.2)); // Boosted ambient light
        const sunLight = new THREE.PointLight(0xffffff, 3.5, 1000);
        scene.add(sunLight);

        // --- TEXTURE/MATERIAL GENERATOR ---
        const textureLoader = new THREE.TextureLoader();
        
        function getMaterial(data) {
            if (data.texture) {
                return new THREE.MeshPhysicalMaterial({ 
                    map: textureLoader.load(data.texture), roughness: 0.6, metalness: 0.1, clearcoat: 0.2
                });
            } else {
                return new THREE.MeshPhysicalMaterial({
                    color: data.color, roughness: data.type === 'gas' ? 0.3 : 0.8,
                    metalness: 0.1, clearcoat: data.type === 'ice' ? 0.5 : 0.0,
                });
            }
        }

        function createSaturnRings(radius) {
            const ringGeo = new THREE.RingGeometry(radius * 1.4, radius * 2.4, 64);
            const pos = ringGeo.attributes.position;
            const v3 = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++){
                v3.fromBufferAttribute(pos, i);
                ringGeo.attributes.uv.setXY(i, v3.length() < (radius * 1.9) ? 0 : 1, 1);
            }
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 1;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0,0,256,0);
            gradient.addColorStop(0, 'rgba(200, 180, 150, 0)');
            gradient.addColorStop(0.2, 'rgba(200, 180, 150, 0.5)');
            gradient.addColorStop(0.5, 'rgba(150, 130, 100, 0.8)');
            gradient.addColorStop(0.8, 'rgba(200, 180, 150, 0.3)');
            gradient.addColorStop(1, 'rgba(200, 180, 150, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0,0,256,1);
            
            const ringTex = new THREE.CanvasTexture(canvas);
            const ringMat = new THREE.MeshPhysicalMaterial({ 
                map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.9, roughness: 0.5
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            return ring;
        }

        // --- BUILD SOLAR SYSTEM ---
        const interactableMeshes = [];
        const systemObjects = [];
        let orbitTrails = new THREE.Group();
        scene.add(orbitTrails);
        
        // Array to store labels so we can toggle them safely
        const allLabels = []; 

        celestialData.forEach((data) => {
            const pivot = new THREE.Object3D();
            scene.add(pivot);

            const geo = new THREE.SphereGeometry(data.radius, 64, 64);
            let mesh;

            if (data.type === 'star') {
                const sunMat = new THREE.MeshBasicMaterial({ color: data.color });
                mesh = new THREE.Mesh(geo, sunMat);
                
                const glowGeo = new THREE.SphereGeometry(data.radius * 1.25, 32, 32);
                const glowMat = new THREE.ShaderMaterial({
                    uniforms: { c: { type: "f", value: 0.2 }, p: { type: "f", value: 2.5 }, glowColor: { type: "c", value: new THREE.Color(0xff8800) } },
                    vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                    fragmentShader: `uniform vec3 glowColor; uniform float c; uniform float p; varying vec3 vNormal; void main() { float intensity = pow(c - dot(vNormal, vec3(0.0, 0.0, 1.0)), p); gl_FragColor = vec4(glowColor, intensity); }`,
                    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true
                });
                pivot.add(new THREE.Mesh(glowGeo, glowMat));
            } else {
                mesh = new THREE.Mesh(geo, getMaterial(data));
            }
            
            mesh.position.x = data.dist;
            mesh.rotation.z = data.tilt;
            mesh.userData = data; 
            pivot.add(mesh);
            interactableMeshes.push(mesh);

            // CSS2D Label - Attached ONLY to the planet mesh so it tracks accurately
            const div = document.createElement('div');
            div.className = 'planet-label';
            div.textContent = data.name;
            const label = new THREE.CSS2DObject(div);
            label.position.set(0, data.radius + 1.5, 0); 
            mesh.add(label); 
            allLabels.push(label); // Store reference for the UI toggle

            // Orbit Trail
            if (data.dist > 0) {
                const trailGeo = new THREE.BufferGeometry();
                const pts = [];
                for(let i=0; i<=128; i++) {
                    const angle = (i / 128) * Math.PI * 2;
                    pts.push(Math.cos(angle)*data.dist, 0, Math.sin(angle)*data.dist);
                }
                trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
                const trailMat = new THREE.LineBasicMaterial({ color: 0x444455, transparent: true, opacity: 0.4 });
                orbitTrails.add(new THREE.LineLoop(trailGeo, trailMat));
            }

            // Moons
            if (data.moons) {
                data.moons.forEach(m => {
                    const mPivot = new THREE.Object3D();
                    mesh.add(mPivot);
                    const mMesh = new THREE.Mesh(new THREE.SphereGeometry(m.radius, 32, 32), getMaterial(m));
                    mMesh.position.x = m.dist;
                    mPivot.add(mMesh);
                    systemObjects.push({ pivot: mPivot, speed: m.speed, mesh: mMesh });
                });
            }

            // Rings
            if (data.hasRings) mesh.add(createSaturnRings(data.radius));

            systemObjects.push({ pivot, speed: data.speed, mesh, isPlanet: true });
        });

        // --- ASTEROID BELT ---
        const astGeo = new THREE.DodecahedronGeometry(0.4, 0);
        const astMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9, metalness: 0.1 });
        const astCount = 2000;
        const astMesh = new THREE.InstancedMesh(astGeo, astMat, astCount);
        const dummy = new THREE.Object3D();
        
        for(let i=0; i<astCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const rad = 48 + Math.random() * 10; // Belt located between Mars (42) and Jupiter (65)
            dummy.position.set(Math.cos(angle)*rad, (Math.random()-0.5)*3, Math.sin(angle)*rad);
            dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            const scale = Math.random() * 0.4 + 0.2;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            astMesh.setMatrixAt(i, dummy.matrix);
        }
        scene.add(astMesh);

        // --- INTERACTIVITY ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let focusedObj = null;
        let timeMultiplier = 1;

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('start-screen').style.display = 'none', 500);
        });

        // Click Logic
        window.addEventListener('pointerdown', (e) => {
            if(e.target.closest('.ui-layer') || e.target.closest('.planet-label')) return; 

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(interactableMeshes);
            if(intersects.length > 0) {
                focusPlanet(intersects[0].object);
            } else {
                unfocus();
            }
        });

        function focusPlanet(mesh) {
            focusedObj = mesh;
            const data = mesh.userData;
            
            document.getElementById('info-title').innerText = data.name;
            document.getElementById('info-subtitle').innerText = data.subtitle;
            document.getElementById('stat-day').innerText = data.day;
            document.getElementById('stat-year').innerText = data.year;
            document.getElementById('stat-radius').innerText = data.trueRadius;
            document.getElementById('stat-grav').innerText = data.grav;
            document.getElementById('info-desc').innerText = data.desc;
            document.getElementById('info-fact').innerText = data.fact;
            document.getElementById('info-panel').classList.add('active');

            const tgtPos = new THREE.Vector3();
            mesh.getWorldPosition(tgtPos);
            
            new TWEEN.Tween(controls.target).to({x: tgtPos.x, y: tgtPos.y, z: tgtPos.z}, 1000).easing(TWEEN.Easing.Cubic.Out).start();

            const offset = data.radius * 3 + 4;
            new TWEEN.Tween(camera.position).to({x: tgtPos.x + offset, y: tgtPos.y + (offset/2), z: tgtPos.z + offset}, 1000).easing(TWEEN.Easing.Cubic.Out).start();
        }

        function unfocus() {
            focusedObj = null;
            document.getElementById('info-panel').classList.remove('active');
        }

        document.getElementById('close-info').addEventListener('click', unfocus);

        // Control Panel Toggles
        document.getElementById('toggle-trails').addEventListener('change', (e) => orbitTrails.visible = e.target.checked);
        
        // Loop through the stored labels to toggle visibility
        document.getElementById('toggle-labels').addEventListener('change', (e) => {
            allLabels.forEach(label => label.visible = e.target.checked);
        });
        
        // Asteroid Toggle
        document.getElementById('toggle-asteroids').addEventListener('change', (e) => astMesh.visible = e.target.checked);
        
        document.getElementById('time-slider').addEventListener('input', (e) => timeMultiplier = parseFloat(e.target.value));

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- RENDER LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            // Orbit Dynamics
            systemObjects.forEach(obj => {
                obj.pivot.rotation.y += obj.speed * timeMultiplier;
                obj.mesh.rotation.y += 0.005 * timeMultiplier; 
            });
            
            // Asteroid Rotation
            astMesh.rotation.y += 0.001 * timeMultiplier;

            // Camera Tracking
            if(focusedObj) {
                const currentPos = new THREE.Vector3();
                focusedObj.getWorldPosition(currentPos);
                const delta = currentPos.clone().sub(controls.target);
                camera.position.add(delta);
                controls.target.copy(currentPos);
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
