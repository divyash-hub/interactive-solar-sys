<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural 3D Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Control Bar */
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 10, 30, 0.8); border: 1px solid #00d2ff;
            padding: 10px 20px; border-radius: 30px; display: flex; gap: 15px; align-items: center;
            pointer-events: auto; backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }
        
        button {
            background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #00d2ff;
            padding: 5px 10px; cursor: pointer; border-radius: 5px; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem;
        }
        button:hover, button.active { background: #00d2ff; color: #000; box-shadow: 0 0 10px #00d2ff; }
        
        input[type=range] { accent-color: #00d2ff; cursor: pointer; }
        
        /* Info Panel */
        #info-panel {
            position: absolute; right: -350px; top: 0; width: 300px; height: 100%;
            background: rgba(0, 5, 15, 0.95); border-left: 2px solid #00d2ff;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px; box-sizing: border-box; pointer-events: auto;
            display: flex; flex-direction: column;
        }
        #info-panel.open { right: 0; }
        #info-panel h2 { color: #00d2ff; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-top: 50px; }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.9rem; color: #ccc; }
        .fun-fact { margin-top: 20px; font-style: italic; color: #aaa; line-height: 1.4; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; }
        #close-panel { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #fff; }

        /* Floating Labels */
        .planet-label {
            position: absolute; color: rgba(255, 255, 255, 0.8); font-size: 12px;
            text-shadow: 0 0 4px #000; pointer-events: none; transform: translate(-50%, -50%);
            transition: opacity 0.3s;
        }
        .planet-label.hidden { opacity: 0; }

        /* Loading / Start Overlay */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 15px 40px; font-size: 1.5rem; background: #00d2ff; color: #000; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 0 20px #00d2ff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #00d2ff; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px;">System: Sol</h1>
        <p style="color: #888; margin-bottom: 30px;">Headphones Recommended for Ambient Audio</p>
        <button id="start-btn">Initialize Simulation</button>
    </div>

    <div id="ui-layer">
        <div id="labels-container"></div>
        
        <div id="controls">
            <button id="toggle-labels" class="active">Labels</button>
            <button id="toggle-orbits" class="active">Orbits</button>
            <button id="toggle-asteroids" class="active">Asteroids</button>
            <div style="display: flex; flex-direction: column; align-items: center; margin-left: 10px;">
                <label style="font-size: 10px; color: #aaa;">Time Speed</label>
                <input type="range" id="speed-slider" min="0" max="2" step="0.1" value="0.5">
            </div>
        </div>

        <div id="info-panel">
            <div id="close-panel">&times;</div>
            <h2 id="info-name">Planet Name</h2>
            <div id="info-stats">
                </div>
            <div class="fun-fact" id="info-fact"></div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const config = {
            sunRadius: 10,
            orbitScale: 15, // Scale down distances for visual fit
            planetScale: 1.5, // Scale up planets for visibility
            baseSpeed: 0.2
        };

        const state = {
            speed: 0.5,
            showLabels: true,
            showOrbits: true,
            showAsteroids: true,
            focusedBody: null,
            cameraOffset: new THREE.Vector3(0, 20, 40)
        };

        // --- 2. PROCEDURAL TEXTURE GENERATION (CANVAS API) ---
        function createTexture(type, colorBase, colorSecond) {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Fill background
            ctx.fillStyle = colorBase;
            ctx.fillRect(0, 0, size, size);

            if (type === 'noise') {
                // Rocky Texture
                for (let i = 0; i < 2000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? colorSecond : 'rgba(0,0,0,0.2)';
                    const x = Math.random() * size;
                    const y = Math.random() * size;
                    const r = Math.random() * 3;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (type === 'gas') {
                // Gas Giant Bands
                const grad = ctx.createLinearGradient(0, 0, 0, size);
                grad.addColorStop(0, colorBase);
                grad.addColorStop(0.2, colorSecond);
                grad.addColorStop(0.4, colorBase);
                grad.addColorStop(0.6, colorSecond);
                grad.addColorStop(0.8, colorBase);
                grad.addColorStop(1, colorSecond);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
                
                // Add turbulence
                for(let i=0; i<50; i++){
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.fillRect(0, Math.random()*size, size, Math.random()*20);
                }
            } else if (type === 'sun') {
                // Sun Plasma
                const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.2, '#ffdd00');
                grad.addColorStop(0.8, '#ff5500');
                grad.addColorStop(1, '#aa0000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createStarFieldTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 1024, 1024);
            
            for (let i = 0; i < 800; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 1.5;
                const opacity = Math.random();
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = createStarFieldTexture(); // Use generated stars
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 80, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 500;

        // --- 4. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5); // Soft white light
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 400);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);
        
        const hemiLight = new THREE.HemisphereLight( 0xffffbb, 0x080820, 0.2 );
        scene.add( hemiLight );

        // --- 5. CELESTIAL DATA ---
        const planetData = [
            { name: "Mercury", r: 0.8, dist: 15, speed: 0.04, color: '#aaa', type: 'noise', tilt: 0.03, stats: { type: "Rocky", temp: "167°C" }, fact: "Mercury shrinks as it cools." },
            { name: "Venus", r: 1.5, dist: 25, speed: 0.03, color: '#e6c229', type: 'gas', tilt: 177, stats: { type: "Rocky", temp: "464°C" }, fact: "Venus rotates backward." },
            { name: "Earth", r: 1.6, dist: 35, speed: 0.025, color: '#2a75bb', type: 'noise', tilt: 23.5, stats: { type: "Rocky", temp: "15°C" }, fact: "The only planet with life." },
            { name: "Mars", r: 1.0, dist: 45, speed: 0.02, color: '#c1440e', type: 'noise', tilt: 25, stats: { type: "Rocky", temp: "-65°C" }, fact: "Home to the tallest mountain in the solar system." },
            { name: "Jupiter", r: 5.0, dist: 70, speed: 0.01, color: '#d8ca9d', type: 'gas', tilt: 3, stats: { type: "Gas Giant", temp: "-110°C" }, fact: "Jupiter has 95 moons." },
            { name: "Saturn", r: 4.2, dist: 95, speed: 0.008, color: '#ead6b8', type: 'gas', tilt: 26, hasRing: true, stats: { type: "Gas Giant", temp: "-140°C" }, fact: "Its rings are made of ice and rock." },
            { name: "Uranus", r: 3.0, dist: 120, speed: 0.006, color: '#d1e7e7', type: 'gas', tilt: 98, stats: { type: "Ice Giant", temp: "-195°C" }, fact: "Uranus rolls on its side." },
            { name: "Neptune", r: 2.9, dist: 140, speed: 0.005, color: '#5b5ddf', type: 'gas', tilt: 28, stats: { type: "Ice Giant", temp: "-200°C" }, fact: "Winds can reach 2,100 km/h." },
            { name: "Pluto", r: 0.5, dist: 160, speed: 0.004, color: '#968570', type: 'noise', tilt: 120, stats: { type: "Dwarf", temp: "-225°C" }, fact: "Reclassified as a dwarf planet in 2006." }
        ];

        const celestialObjects = [];
        const labels = [];

        // --- 6. OBJECT CREATION ---

        // Sun
        const sunGeo = new THREE.SphereGeometry(config.sunRadius, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ map: createTexture('sun', '#ff0', '#f00') });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sunMesh);

        // Sun Glow (Sprite)
        const glowCanvas = document.createElement('canvas');
        glowCanvas.width = 128; glowCanvas.height = 128;
        const gCtx = glowCanvas.getContext('2d');
        const gGrad = gCtx.createRadialGradient(64,64,0, 64,64,64);
        gGrad.addColorStop(0, 'rgba(255, 200, 100, 1)');
        gGrad.addColorStop(0.4, 'rgba(255, 100, 0, 0.4)');
        gGrad.addColorStop(1, 'rgba(0,0,0,0)');
        gCtx.fillStyle = gGrad; gCtx.fillRect(0,0,128,128);
        const glowTex = new THREE.CanvasTexture(glowCanvas);
        const glowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffaa00, transparent: true, blending: THREE.AdditiveBlending });
        const glowSprite = new THREE.Sprite(glowMat);
        glowSprite.scale.set(40, 40, 1);
        scene.add(glowSprite);

        // Planets
        planetData.forEach(p => {
            const objContainer = new THREE.Object3D(); // Orbit container
            scene.add(objContainer);

            // Mesh
            const geo = new THREE.SphereGeometry(p.r * config.planetScale, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ 
                map: createTexture(p.type, p.color, p.type === 'gas' ? '#555' : '#333'),
                roughness: 0.8
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.x = p.dist + config.sunRadius;
            mesh.rotation.z = p.tilt * (Math.PI / 180);
            objContainer.add(mesh);

            // Orbit Path Visuals
            const orbitCurve = new THREE.EllipseCurve(0, 0, p.dist + config.sunRadius, p.dist + config.sunRadius, 0, 2 * Math.PI, false, 0);
            const orbitPoints = orbitCurve.getPoints(100);
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
            const orbitLine = new THREE.Line(orbitGeo, orbitMat);
            orbitLine.rotation.x = Math.PI / 2;
            scene.add(orbitLine);

            // Rings (Saturn)
            if (p.hasRing) {
                const ringGeo = new THREE.RingGeometry(p.r * 1.8, p.r * 3, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xaa8866, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                mesh.add(ring);
            }

            // Moons (Procedural)
            if(p.name === "Earth") createMoon(mesh, 3, 0.4);
            if(p.name === "Jupiter") { createMoon(mesh, 7, 0.6); createMoon(mesh, 9, 0.5); }

            // Label Element
            const div = document.createElement('div');
            div.className = 'planet-label';
            div.textContent = p.name;
            document.getElementById('labels-container').appendChild(div);

            celestialObjects.push({
                mesh: mesh,
                container: objContainer,
                orbitLine: orbitLine,
                data: p,
                angle: Math.random() * Math.PI * 2,
                label: div
            });
        });

        function createMoon(parent, dist, r) {
            const moonGeo = new THREE.SphereGeometry(r, 16, 16);
            const moonMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            
            const pivot = new THREE.Object3D();
            parent.add(pivot);
            pivot.add(moon);
            moon.position.x = dist;
            
            // Animate moon later
            pivot.userData = { speed: 0.05 + Math.random()*0.05 };
            return pivot;
        }

        // Asteroid Belt (InstancedMesh for performance)
        const asteroidCount = 1000;
        const asteroidGeo = new THREE.DodecahedronGeometry(0.2, 0);
        const asteroidMat = new THREE.MeshStandardMaterial({ color: 0x777777 });
        const asteroids = new THREE.InstancedMesh(asteroidGeo, asteroidMat, asteroidCount);
        const dummy = new THREE.Object3D();

        for (let i = 0; i < asteroidCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 55 + Math.random() * 10; // Between Mars and Jupiter
            const y = (Math.random() - 0.5) * 2;
            dummy.position.set(Math.cos(angle) * dist, y, Math.sin(angle) * dist);
            dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            dummy.scale.setScalar(Math.random() * 1.5 + 0.5);
            dummy.updateMatrix();
            asteroids.setMatrixAt(i, dummy.matrix);
        }
        scene.add(asteroids);

        // --- 7. AUDIO (WEB AUDIO API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playAmbient() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            // Create a drone using oscillators
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc1.type = 'sine'; osc1.frequency.value = 50;
            osc2.type = 'triangle'; osc2.frequency.value = 55; // Detuned
            
            filter.type = 'lowpass';
            filter.frequency.value = 400;

            gainNode.gain.value = 0.05;

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
        }

        function playClickSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- 8. INTERACTIVITY & UI LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', onMouseClick);
        function onMouseClick(event) {
            // Ignore if clicking UI elements
            if(event.target.closest('#controls') || event.target.closest('#info-panel') || event.target.closest('#start-screen')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Check intersection with planets
            const meshes = celestialObjects.map(obj => obj.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const selected = celestialObjects.find(obj => obj.mesh === intersects[0].object);
                focusPlanet(selected);
                playClickSound();
            } else {
                state.focusedBody = null; // Unfocus
                closeInfoPanel();
            }
        }

        function focusPlanet(obj) {
            state.focusedBody = obj;
            
            // Update Info Panel
            const panel = document.getElementById('info-panel');
            document.getElementById('info-name').textContent = obj.data.name;
            document.getElementById('info-stats').innerHTML = `
                <div class="stat-row"><span>Type:</span> <span>${obj.data.stats.type}</span></div>
                <div class="stat-row"><span>Temp:</span> <span>${obj.data.stats.temp}</span></div>
                <div class="stat-row"><span>Orbit Speed:</span> <span>${obj.data.speed}</span></div>
            `;
            document.getElementById('info-fact').textContent = obj.data.fact;
            panel.classList.add('open');
        }

        function closeInfoPanel() {
            document.getElementById('info-panel').classList.remove('open');
        }

        document.getElementById('close-panel').addEventListener('click', () => {
            state.focusedBody = null;
            closeInfoPanel();
        });

        // Toggles
        document.getElementById('toggle-labels').addEventListener('click', (e) => {
            state.showLabels = !state.showLabels;
            e.target.classList.toggle('active');
            document.getElementById('labels-container').style.display = state.showLabels ? 'block' : 'none';
        });
        
        document.getElementById('toggle-orbits').addEventListener('click', (e) => {
            state.showOrbits = !state.showOrbits;
            e.target.classList.toggle('active');
            celestialObjects.forEach(obj => obj.orbitLine.visible = state.showOrbits);
        });

        document.getElementById('toggle-asteroids').addEventListener('click', (e) => {
            state.showAsteroids = !state.showAsteroids;
            e.target.classList.toggle('active');
            asteroids.visible = state.showAsteroids;
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            playAmbient();
        });

        // --- 9. ANIMATION LOOP ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Rotate Sun
            sunMesh.rotation.y += 0.002;

            // Animate Planets
            celestialObjects.forEach(obj => {
                // Orbit movement
                obj.angle += obj.data.speed * config.baseSpeed * state.speed;
                const r = obj.data.dist + config.sunRadius;
                obj.mesh.position.x = Math.cos(obj.angle) * r;
                obj.mesh.position.z = Math.sin(obj.angle) * r;

                // Self rotation
                obj.mesh.rotation.y += 0.01;

                // Moon Rotation (children of mesh)
                obj.mesh.children.forEach(child => {
                    if(child.userData.speed) {
                        child.rotation.y += child.userData.speed * state.speed * 2;
                    }
                });

                // Update Labels Position
                if (state.showLabels) {
                    const tempV = new THREE.Vector3();
                    obj.mesh.getWorldPosition(tempV);
                    tempV.y += obj.data.r * 2 + 1; // Offset above planet
                    tempV.project(camera);

                    const x = (tempV.x * .5 + .5) * window.innerWidth;
                    const y = (tempV.y * -.5 + .5) * window.innerHeight;

                    // Hide if behind camera or too far
                    if(tempV.z < 1 && Math.abs(x) < window.innerWidth && Math.abs(y) < window.innerHeight) {
                         obj.label.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                         obj.label.classList.remove('hidden');
                    } else {
                        obj.label.classList.add('hidden');
                    }
                }
            });

            // Rotate Asteroid Belt
            asteroids.rotation.y += 0.001 * state.speed;

            // Camera Focus Logic
            if (state.focusedBody) {
                const targetPos = new THREE.Vector3();
                state.focusedBody.mesh.getWorldPosition(targetPos);
                
                // Calculate desired camera position (offset from planet)
                const offset = new THREE.Vector3(10, 5, 10); 
                const desiredPos = targetPos.clone().add(offset);
                
                // Smoothly interpolate camera position
                camera.position.lerp(desiredPos, 0.05);
                controls.target.lerp(targetPos, 0.05);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
